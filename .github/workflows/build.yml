name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore KeyTrail.slnx

      - name: Build
        run: dotnet build KeyTrail.slnx -c Release --no-restore

      - name: Run smoke probe build
        run: dotnet build tests/SmokeProbe/SmokeProbe.csproj -c Release --no-restore

